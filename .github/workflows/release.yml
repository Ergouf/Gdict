name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - '.github/release-version'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g. v1.3.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION='${{ inputs.tag }}'
            VERSION=${VERSION#v}
          else
            VERSION=$(tr -d '[:space:]' < .github/release-version)
            VERSION=${VERSION#v}
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare local release tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('android/**/*.gradle.kts', 'android/**/gradle-wrapper.properties', 'shared/**/*.gradle.kts') }}
          restore-keys: gradle-android-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Verify environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          android/gradlew -v --project-dir android

      - name: Create keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - name: Build Release APK
        working-directory: android
        run: ./gradlew clean assembleRelease --stacktrace --info
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        id: rename
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APK_NAME="GDict-Android-${VERSION}.apk"
          APK_DIR="android/app/build/outputs/apk/release"
          if [ -f "${APK_DIR}/app-release.apk" ]; then
            mv "${APK_DIR}/app-release.apk" "${APK_DIR}/${APK_NAME}"
          elif [ -f "${APK_DIR}/app-release-unsigned.apk" ]; then
            mv "${APK_DIR}/app-release-unsigned.apk" "${APK_DIR}/${APK_NAME}"
          else
            find "${APK_DIR}/" -name "*.apk" -exec mv {} "${APK_DIR}/${APK_NAME}" \;
          fi
          echo "apk_path=${APK_DIR}/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.rename.outputs.apk_path }}
          retention-days: 1

  build-desktop:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION='${{ inputs.tag }}'
            VERSION=${VERSION#v}
          else
            VERSION=$(tr -d '[:space:]' < .github/release-version)
            VERSION=${VERSION#v}
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare local release tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-desktop-${{ hashFiles('desktop/**/*.gradle.kts', 'desktop/**/gradle-wrapper.properties', 'shared/**/*.gradle.kts') }}
          restore-keys: gradle-desktop-

      - name: Make gradlew executable
        shell: bash
        run: chmod +x desktop/gradlew

      - name: Download JCEF bundle
        shell: bash
        run: |
          JCEF_DIR="desktop/app/resources/windows-x64/jcef-bundle"
          mkdir -p "$JCEF_DIR"
          curl -L -o jcef-bundle.tar.gz "https://github.com/jcefmaven/jcefbuild/releases/download/1.0.60/windows-amd64.tar.gz"
          tar -xzf jcef-bundle.tar.gz -C "$JCEF_DIR" --strip-components=1
          touch "$JCEF_DIR/install.lock"
          rm jcef-bundle.tar.gz
          echo "JCEF bundle downloaded to $JCEF_DIR"
          ls -la "$JCEF_DIR"

      - name: Verify environment
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          desktop/gradlew -v --project-dir desktop

      - name: Build Desktop EXE
        working-directory: desktop
        shell: bash
        run: ./gradlew clean packageExe --stacktrace --info

      - name: Rename EXE
        id: rename
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          EXE_NAME="GDict-Windows-${VERSION}.exe"
          EXE_DIR="desktop/app/build/compose/binaries/main/exe"
          if [ -f "${EXE_DIR}/Gdict.exe" ]; then
            mv "${EXE_DIR}/Gdict.exe" "${EXE_DIR}/${EXE_NAME}"
          else
            find "${EXE_DIR}/" -name "*.exe" -exec mv {} "${EXE_DIR}/${EXE_NAME}" \;
          fi
          echo "exe_path=${EXE_DIR}/${EXE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ${{ steps.rename.outputs.exe_path }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION='${{ inputs.tag }}'
            VERSION=${VERSION#v}
          else
            VERSION=$(tr -d '[:space:]' < .github/release-version)
            VERSION=${VERSION#v}
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./release-assets

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./release-assets

      - name: List release assets
        run: ls -la ./release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GDict v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ./release-assets/*

      - name: Remove older GitHub releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r release_id release_tag; do
            if [[ -n "$release_id" && "$release_tag" != "$CURRENT_TAG" ]]; then
              echo "Deleting old release ${release_tag} (${release_id})"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            fi
          done
