name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android_project/**/*.gradle.kts', 'android_project/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Create keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android_project/release.keystore

      - name: Build Release APK
        working-directory: android_project
        run: ./gradlew assembleRelease
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        id: rename
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/v}
          APK_NAME="GDict-${TAG_NAME}.apk"
          mv android_project/app/build/outputs/apk/release/app-release-unsigned.apk "android_project/app/build/outputs/apk/release/${APK_NAME}" 2>/dev/null || \
          mv android_project/app/build/outputs/apk/release/app-release.apk "android_project/app/build/outputs/apk/release/${APK_NAME}" 2>/dev/null || \
          find android_project/app/build/outputs/apk/release/ -name "*.apk" -exec mv {} "android_project/app/build/outputs/apk/release/${APK_NAME}" \;
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_path=android_project/app/build/outputs/apk/release/${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: GDict ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.rename.outputs.apk_path }}
