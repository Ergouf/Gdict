name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g. v1.3.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('android/**/*.gradle.kts', 'android/**/gradle-wrapper.properties', 'shared/**/*.gradle.kts') }}
          restore-keys: gradle-android-

      - name: Create keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/v}
          else
            TAG_NAME=${{ inputs.tag }}
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Rename APK
        id: rename
        run: |
          TAG_NAME=${{ steps.tag.outputs.tag_name }}
          APK_NAME="GDict-Android-${TAG_NAME}.apk"
          APK_DIR="android/app/build/outputs/apk/release"
          if [ -f "${APK_DIR}/app-release.apk" ]; then
            mv "${APK_DIR}/app-release.apk" "${APK_DIR}/${APK_NAME}"
          elif [ -f "${APK_DIR}/app-release-unsigned.apk" ]; then
            mv "${APK_DIR}/app-release-unsigned.apk" "${APK_DIR}/${APK_NAME}"
          else
            find "${APK_DIR}/" -name "*.apk" -exec mv {} "${APK_DIR}/${APK_NAME}" \;
          fi
          echo "apk_path=${APK_DIR}/${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.rename.outputs.apk_path }}
          retention-days: 1

  build-desktop:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-desktop-${{ hashFiles('desktop/**/*.gradle.kts', 'desktop/**/gradle-wrapper.properties', 'shared/**/*.gradle.kts') }}
          restore-keys: gradle-desktop-

      - name: Build Desktop EXE
        working-directory: desktop
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean packageExe --stacktrace

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/v}
          else
            TAG_NAME=${{ inputs.tag }}
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Rename EXE
        id: rename
        shell: bash
        run: |
          TAG_NAME=${{ steps.tag.outputs.tag_name }}
          EXE_NAME="GDict-Windows-${TAG_NAME}.exe"
          EXE_DIR="desktop/app/build/compose/binaries/main/exe"
          if [ -f "${EXE_DIR}/Gdict.exe" ]; then
            mv "${EXE_DIR}/Gdict.exe" "${EXE_DIR}/${EXE_NAME}"
          else
            find "${EXE_DIR}/" -name "*.exe" -exec mv {} "${EXE_DIR}/${EXE_NAME}" \;
          fi
          echo "exe_path=${EXE_DIR}/${EXE_NAME}" >> $GITHUB_OUTPUT

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ${{ steps.rename.outputs.exe_path }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/v}
          else
            TAG_NAME=${{ inputs.tag }}
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./release-assets

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./release-assets

      - name: List release assets
        run: ls -la ./release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.tag.outputs.tag_name }}
          name: GDict v${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          files: ./release-assets/*
